  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-medicore}:${POSTGRES_PASSWORD:-medicore_secret}@postgres:5432/${POSTGRES_DB:-medicore}
  #     REDIS_URL: redis://redis:6379
  #     JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - medicore-network

  # ── Frontend (Next.js) — placeholder ───────────────────────────
  # Uncomment once the Next.js app is scaffolded (Task 2+)
  #
  # frontend:
  #   build:
  #     context: ./apps/frontend
