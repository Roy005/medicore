# ── Volumes ────────────────────────────────────────────────────
volumes:
  medicore_pgdata:
    driver: local
  medicore_redisdata:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  medicore-network:
    driver: bridge
