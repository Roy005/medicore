# ============================================
# MediCore — Render Blueprint
# ============================================
# This file tells Render how to deploy all services.
# Docs: https://render.com/docs/blueprint-spec
# ============================================

services:
  # ── AI Service (Python FastAPI) ────────────
  - type: web
    name: medicore-ai-service
    runtime: docker
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: ./apps/ai-service
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ── Backend (NestJS) ───────────────────────
  - type: web
    name: medicore-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 24h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://medicore-blue.vercel.app
